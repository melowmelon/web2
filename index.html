<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Anjana ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #f3d0b3;
            font-family: 'Patrick Hand', cursive;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- UI Overlays --- */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center; 
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
            z-index: 100;
        }

        .active-ui {
            pointer-events: auto;
        }

        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Start Screen */
        #start-screen {
            background: #f5cebe;
            justify-content: center;
            z-index: 200;
        }
        
        #start-screen h1 {
            font-size: clamp(1.2rem, 5vw, 2rem);
            text-align: center;
            padding: 0 20px;
            color: #333;
        }

        /* Buttons */
        .btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: clamp(12px, 3vw, 15px) clamp(30px, 8vw, 40px);
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-family: 'Patrick Hand', cursive;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin: 10px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn:active { transform: scale(0.9); }

        /* Prompt */
        #prompt-container {
            position: absolute;
            bottom: 15%;
            width: 100%;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.5s;
            z-index: 50;
        }
        
        .prompt-text {
            font-size: clamp(1rem, 3.5vw, 1.4rem);
            color: #555;
            background: rgba(255,255,255,0.85);
            padding: 10px 25px;
            border-radius: 30px;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(2px);
        }

        /* Question Box */
        #question-box {
            position: absolute;
            top: 18%; 
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            padding: clamp(15px, 4vw, 25px) clamp(20px, 6vw, 35px);
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            transform: scale(0.8) translateY(-20px);
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 85%;
            max-width: 380px;
            color: #333;
            border: 2px solid rgba(255,255,255,0.5);
        }
        
        #question-box.visible {
            transform: scale(1) translateY(0);
            opacity: 1;
            pointer-events: auto; 
        }

        #question-box.fallen {
            transform: scale(0.85) translateY(calc(82vh - 18%));
            opacity: 0.95;
            transition: all 2.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #question-box h1 {
            font-size: clamp(1.2rem, 4.5vw, 1.8rem);
            margin-bottom: 20px;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        #btn-yes { background-color: #6ab04c; }
        #btn-no { background-color: #eb4d4b; position: relative; }

        /* --- Slideshow CSS --- */
        .polaroid {
            position: absolute;
            top: 20%;
            width: clamp(120px, 25vw, 200px);
            padding: 10px;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 2s ease-in-out;
            pointer-events: none;
            z-index: 40;
        }

        /* Specific positioning */
        #img-left {
            left: 5%;
            transform: rotate(-5deg);
        }

        #img-right {
            right: 5%;
            transform: rotate(5deg);
        }

        .polaroid img {
            width: 100%;
            border-radius: 2px;
            display: block;
        }

    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="start-screen" class="overlay active-ui">
        <h1>I forgot something important...<br><span style="font-size:0.6em; color:#888">(Turn on sound)</span></h1>
        <button class="btn" id="btn-start">Tap to Start</button>
    </div>

    <div id="prompt-container">
        <div class="prompt-text">Hold down to make up</div>
    </div>

    <div class="polaroid" id="img-left">
        <img id="photo-l" src="" alt="">
    </div>
    <div class="polaroid" id="img-right">
        <img id="photo-r" src="" alt="">
    </div>

    <div id="question-layer" class="overlay">
        <div id="question-box">
            <h1>Will you forever be my Valentine?</h1>
            <div class="btn-row">
                <button class="btn" id="btn-yes">Yes, my strawbaby ❤️</button>
                <button class="btn" id="btn-no">No 😠</button>
            </div>
        </div>
    </div>

    <audio id="bg-audio" loop>
        <source src="yes.mp3" type="audio/mp3">
    </audio>

    <script>
        // --- PHOTO CONFIGURATION (Matched to your screenshot) ---
        // Ensure filenames match EXACTLY (case sensitive!)
        const photoList = [
            'pics/IMG_7636.JPG',
            'pics/IMG_7637.JPG',
            'pics/IMG_7638.JPG',
            'pics/IMG_7639.JPG',
            'pics/IMG_7640.JPG',
            'pics/IMG_7641.JPG',
            'pics/IMG_7642.JPG',
            'pics/IMG_7643.JPG',
            'pics/IMG_7644.JPG',
            'pics/IMG_7645.JPG',
            'pics/IMG_7646.JPG',
            'pics/IMG_7647.JPG'
        ];
        // ---------------------------

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bg-audio');

        // UI
        const startScreen = document.getElementById('start-screen');
        const promptContainer = document.getElementById('prompt-container');
        const questionLayer = document.getElementById('question-layer');
        const questionBox = document.getElementById('question-box');
        const btnStart = document.getElementById('btn-start');
        const btnYes = document.getElementById('btn-yes');
        const btnNo = document.getElementById('btn-no');
        
        const divLeft = document.getElementById('img-left');
        const divRight = document.getElementById('img-right');
        const imgL = document.getElementById('photo-l');
        const imgR = document.getElementById('photo-r');

        // Config
        let width, height, pixelRatio;
        
        // Game State
        let gameState = 'WAITING'; 
        let walkProgress = 0; 
        let isHolding = false;
        let celebrationStartTime = 0;
        
        // Objects
        let heartSize = 0;
        let targetHeartSize = 0;
        let heartY = 0; 
        let targetHeartY = 0;

        let confetti = [];
        let stars = [];
        let shootingStars = [];
        let flowers = [];
        let fireflies = [];
        let fireworks = [];
        let petals = []; 

        // Camera
        let camera = { x: 0, y: 0, zoom: 1 };
        let targetCamera = { x: 0, y: 0, zoom: 1 };

        // Colors
        const SKY_DAY = {r: 255, g: 250, b: 240}; 
        const SKY_SUNSET = {r: 255, g: 180, b: 180};
        const SKY_NIGHT = {r: 25, g: 25, b: 65}; 
        const GRASS_DAY = {r: 123, g: 173, b: 94}; 
        const GRASS_NIGHT = {r: 45, g: 64, b: 32}; 

        // --- Init ---
        function init() {
            // Stars
            for(let i=0; i<200; i++) {
                stars.push({
                    x: (Math.random() * 4000) - 2000, 
                    y: (Math.random() * 1000) - 500, 
                    size: Math.random() * 2 + 0.5,
                    blinkOffset: Math.random() * 100
                });
            }
            // Fireflies
            for(let i=0; i<40; i++) {
                fireflies.push({
                    x: (Math.random() * 4000) - 2000,
                    y: (Math.random() * 600) - 300,
                    size: Math.random() * 3 + 1,
                    speedX: (Math.random() - 0.5) * 0.5,
                    speedY: (Math.random() - 0.5) * 0.5,
                    offset: Math.random() * 100
                });
            }
            // Flowers
            const flowerCount = 15;
            const spread = 4000;
            for(let i=0; i<flowerCount; i++) {
                const posX = (Math.random() * spread) - (spread/2);
                if (Math.abs(posX) < 80) continue; 
                flowers.push({
                    x: posX,
                    yOffset: Math.random() * 15, 
                    color: `hsl(${330 + (Math.random() * 40)}, 85%, 70%)`, 
                    growThreshold: 0.1 + Math.random() * 0.7 
                });
            }
        }
        
        function initPetals() {
            petals = [];
            for(let i=0; i<30; i++) {
                petals.push({
                    x: Math.random() * width, 
                    y: Math.random() * height,
                    size: Math.random() * 4 + 2,
                    speedY: Math.random() * 1 + 0.5,
                    swayOffset: Math.random() * 100,
                    rotation: Math.random() * 360
                });
            }
        }
        init();

        function resize() {
            pixelRatio = window.devicePixelRatio || 1;
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * pixelRatio;
            canvas.height = height * pixelRatio;
            ctx.scale(pixelRatio, pixelRatio);
            initPetals();
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Slideshow Logic ---
        function startSlideshow() {
            if(photoList.length === 0) return;
            
            let idxL = 0;
            let idxR = 1 % photoList.length; // Ensure different start

            const updatePhotos = () => {
                // Fade out
                divLeft.style.opacity = 0;
                divRight.style.opacity = 0;

                setTimeout(() => {
                    // Change Images
                    imgL.src = photoList[idxL];
                    imgR.src = photoList[idxR];

                    // Increment indices
                    idxL = (idxL + 2) % photoList.length;
                    idxR = (idxR + 2) % photoList.length;

                    // Fade In
                    divLeft.style.opacity = 0.9;
                    divRight.style.opacity = 0.9;
                }, 2000);
            };

            // Initial Load
            imgL.src = photoList[idxL];
            imgR.src = photoList[idxR];
            idxL = (idxL + 2) % photoList.length;
            idxR = (idxR + 2) % photoList.length;
            
            setTimeout(() => {
                divLeft.style.opacity = 0.9;
                divRight.style.opacity = 0.9;
            }, 500);

            setInterval(updatePhotos, 6000);
        }

        // --- Interaction ---

        btnStart.addEventListener('click', () => {
            startScreen.classList.add('hidden');
            gameState = 'WALKING';
            audio.volume = 0.09;
            audio.play().catch(console.error);
        });

        const startAction = (e) => { if(gameState === 'WALKING') isHolding = true; };
        const endAction = () => { isHolding = false; };

        window.addEventListener('mousedown', startAction);
        window.addEventListener('mouseup', endAction);
        window.addEventListener('touchstart', (e) => { 
            if(e.target === canvas) e.preventDefault();
            startAction(); 
        }, {passive: false});
        window.addEventListener('touchend', endAction);

        // Run Away "No" Button
        function moveNoBtn() {
            if(gameState !== 'ASKING') return;
            const range = 50;
            const dx = (Math.random() - 0.5) * range * 2;
            const dy = (Math.random() - 0.5) * range * 2;
            btnNo.style.transform = `translate(${dx}px, ${dy}px)`;
        }
        btnNo.addEventListener('mouseover', moveNoBtn);
        btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); moveNoBtn(); });

        // Yes Button
        btnYes.addEventListener('click', () => {
            gameState = 'CELEBRATING';
            celebrationStartTime = Date.now(); 
            
            questionBox.innerHTML = "<h1 style='color:#333'>Yay!! ❤️</h1><p style='color:#555'>(I love you a little extra today)</p>";
            
            // Make the question box fall to the bottom
            setTimeout(() => {
                questionBox.classList.add('fallen');
            }, 500);
            
            startSlideshow();

            let vol = audio.volume;
            const fade = setInterval(() => {
                vol += 0.05;
                if(vol >= 1.0) { vol = 1.0; clearInterval(fade); }
                audio.volume = vol;
            }, 100);

            // Mobile-responsive heart size
            const maxHeartSize = Math.min(width, height) * 0.6;
            targetHeartSize = Math.min(500, maxHeartSize);

            // Confetti
            for(let i=0; i<150; i++) {
                confetti.push({
                    x: 0, y: -200, 
                    vx: (Math.random()-0.5)*15, 
                    vy: Math.random()*10+5,
                    color: `hsl(${Math.random()*360},100%,60%)`,
                    rotation: Math.random()*360
                });
            }
        });

        // --- Helpers ---
        function lerp(start, end, t) { return start * (1-t) + end * t; }
        
        function getColor(c1, c2, t) {
            return `rgb(
                ${Math.round(lerp(c1.r, c2.r, t))},
                ${Math.round(lerp(c1.g, c2.g, t))},
                ${Math.round(lerp(c1.b, c2.b, t))}
            )`;
        }

        function getSkyColor(progress) {
            if (progress < 0.5) return getColor(SKY_DAY, SKY_SUNSET, progress * 2);
            else return getColor(SKY_SUNSET, SKY_NIGHT, (progress - 0.5) * 2);
        }

        function getGrassColor(progress) {
            return getColor(GRASS_DAY, GRASS_NIGHT, progress);
        }

        // --- Drawing ---

        function drawNaturalFlower(ctx, x, y, scale, color) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            const wind = Math.sin(Date.now() / 500 + x) * 0.1;
            ctx.rotate(wind);
            ctx.strokeStyle = '#6ab04c'; ctx.lineWidth = 2; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(5, -15, 0, -30); ctx.stroke();
            ctx.fillStyle = '#6ab04c';
            ctx.beginPath(); ctx.ellipse(4, -10, 6, 3, Math.PI/5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(-4, -15, 5, 2, -Math.PI/5, 0, Math.PI*2); ctx.fill();
            ctx.translate(0, -30);
            ctx.fillStyle = color;
            for(let i=0; i<6; i++) {
                ctx.rotate(Math.PI/3);
                ctx.beginPath(); ctx.ellipse(0, -8, 5, 8, 0, 0, Math.PI*2); ctx.fill();
            }
            ctx.fillStyle = '#ffeaa7';
            ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        function drawHeart(ctx, x, y, size) {
            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            const s = size;
            ctx.moveTo(x, y);
            ctx.bezierCurveTo(x - s/2, y - s/2, x - s, y + s/3, x, y + s);
            ctx.bezierCurveTo(x + s, y + s/3, x + s/2, y - s/2, x, y);
            ctx.fill();
        }

        function drawFace(ctx, x, y, facingRight) {
            const eyeOffset = facingRight ? 6 : -6;
            const lookY = (gameState === 'PANNING' || gameState === 'ASKING') ? -5 : 0;
            
            ctx.fillStyle = '#2d3436';
            ctx.strokeStyle = '#2d3436';
            ctx.lineWidth = 2;

            if (gameState === 'CELEBRATING') {
                const leftEyeX = x - 7 + eyeOffset;
                const rightEyeX = x + 7 + eyeOffset;
                ctx.beginPath(); ctx.moveTo(leftEyeX - 3, y - 2); ctx.lineTo(leftEyeX, y - 5); ctx.lineTo(leftEyeX + 3, y - 2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(rightEyeX - 3, y - 2); ctx.lineTo(rightEyeX, y - 5); ctx.lineTo(rightEyeX + 3, y - 2); ctx.stroke();
            } else {
                const blink = (Math.sin(Date.now()/2000) > 0.98);
                if(!blink) {
                    ctx.beginPath(); ctx.arc(x - 7 + eyeOffset, y - 2 + lookY, 3, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(x + 7 + eyeOffset, y - 2 + lookY, 3, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.beginPath(); ctx.moveTo(x - 10 + eyeOffset, y - 2 + lookY); ctx.lineTo(x - 4 + eyeOffset, y - 2 + lookY); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(x + 4 + eyeOffset, y - 2 + lookY); ctx.lineTo(x + 10 + eyeOffset, y - 2 + lookY); ctx.stroke();
                }
            }
            ctx.fillStyle = 'rgba(255, 118, 117, 0.4)';
            ctx.beginPath(); ctx.arc(x+eyeOffset-9, y+6, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x+eyeOffset+9, y+6, 5, 0, Math.PI*2); ctx.fill();
        }

        function drawFirework(ctx, f) {
            ctx.save();
            ctx.translate(f.x, f.y);
            ctx.globalAlpha = f.life;
            f.particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.restore();
        }

        // --- Logic ---

        function update() {
            camera.x += (targetCamera.x - camera.x) * 0.05;
            camera.y += (targetCamera.y - camera.y) * 0.05;
            camera.zoom += (targetCamera.zoom - camera.zoom) * 0.05;

            heartSize += (targetHeartSize - heartSize) * 0.05;
            heartY += (targetHeartY - heartY) * 0.05;

            if (gameState === 'WALKING') {
                targetHeartSize = 0;
                targetHeartY = (height/2 + 50) - 100; 
                
                if(isHolding) {
                    walkProgress += 0.004;
                    promptContainer.style.opacity = 0;
                } else {
                    walkProgress -= 0.005;
                    promptContainer.style.opacity = 1;
                }
                walkProgress = Math.max(0, Math.min(1, walkProgress));

                if(walkProgress === 1) {
                    gameState = 'MEETING';
                    targetHeartSize = 40; 
                    setTimeout(() => gameState = 'ZOOMING', 500);
                }
            }
            
            if (gameState === 'ZOOMING') {
                targetCamera.zoom = 2.2; 
                targetCamera.y = 50; 
                if(Math.abs(camera.zoom - 2.2) < 0.1) setTimeout(() => gameState = 'PANNING', 800);
            }

            if (gameState === 'PANNING') {
                targetCamera.zoom = 1.4;
                targetCamera.y = 100; 
                targetHeartSize = 60; 
                targetHeartY = (height/2 + 50) - 100; 

                if(Math.abs(camera.y - 100) < 5) {
                    gameState = 'ASKING';
                    questionLayer.classList.add('active-ui');
                    questionBox.classList.add('visible');
                }
            }

            if(gameState === 'CELEBRATING') {
                targetCamera.zoom = 1.0;
                targetCamera.y = 0;
                targetHeartY = 100; 
                
                // Mobile-responsive heart size
                const maxHeartSize = Math.min(width, height) * 0.6;
                targetHeartSize = Math.min(500, maxHeartSize);

                // Spawn Fireworks
                if(Math.random() < 0.01) { 
                    const fwX = (Math.random() * width) - width/2;
                    const fwY = (Math.random() * 300) - 200; 
                    const particles = [];
                    const color = `hsl(${Math.random()*360}, 100%, 60%)`;
                    for(let i=0; i<30; i++) {
                        particles.push({
                            x: 0, y: 0,
                            vx: (Math.random() - 0.5) * 10,
                            vy: (Math.random() - 0.5) * 10,
                            color: color
                        });
                    }
                    fireworks.push({ x: fwX, y: fwY, life: 1, particles: particles });
                }
            }

            // Update Fireworks
            for(let i=fireworks.length-1; i>=0; i--) {
                let f = fireworks[i];
                f.life -= 0.02;
                f.particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.1;
                });
                if(f.life <= 0) fireworks.splice(i, 1);
            }

            // Shooting Stars
            if (walkProgress > 0.8 && Math.random() < 0.01) {
                shootingStars.push({
                    x: Math.random() * 2000 - 1000,
                    y: -Math.random() * 500 - 100,
                    len: Math.random() * 50 + 20,
                    life: 1.0
                });
            }
            for(let i = shootingStars.length - 1; i >= 0; i--) {
                let s = shootingStars[i];
                s.x += 10; s.y += 10; s.life -= 0.05;
                if(s.life <= 0) shootingStars.splice(i, 1);
            }

            // Fireflies
            fireflies.forEach(f => {
                f.x += f.speedX; f.y += f.speedY;
                if(f.x > 3000 || f.x < -3000) f.speedX *= -1;
            });

            // Falling Petals - Start at 0.1 progress
            if (walkProgress > 0.1) { 
                petals.forEach(p => {
                    p.y += p.speedY;
                    p.x += (Math.sin(Date.now() / 1000 + p.swayOffset) * 2) + 0.5;
                    
                    if(p.y > height) p.y = -10; 
                    if(p.x > width + 10) p.x = -10;
                    if(p.x < -10) p.x = width + 10;
                });
            }
        }

        function render() {
            ctx.clearRect(0,0,width,height);

            // Sky
            ctx.fillStyle = getSkyColor(walkProgress);
            ctx.fillRect(0,0,width,height);

            ctx.save();
            ctx.translate(width/2, height/2);
            ctx.scale(camera.zoom, camera.zoom);
            ctx.translate(-width/2 + camera.x, -height/2 + camera.y);

            // Stars
            if(walkProgress > 0.1) {
                ctx.fillStyle = 'white';
                stars.forEach(s => {
                    const alpha = Math.min(walkProgress, Math.abs(Math.sin((Date.now()+s.blinkOffset)/600)));
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;

                // Moon
                ctx.shadowBlur = 50; ctx.shadowColor = '#fdfd96'; ctx.fillStyle = '#fdfd96';
                ctx.globalAlpha = Math.max(0, walkProgress - 0.2);
                ctx.beginPath(); ctx.arc(300, -300, 50, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0; ctx.globalAlpha = 1;
            }

            // Fireworks
            fireworks.forEach(f => drawFirework(ctx, f));

            shootingStars.forEach(s => { 
                ctx.globalAlpha = s.life; 
                ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.len, s.y - s.len); ctx.stroke();
                ctx.beginPath(); ctx.arc(s.x, s.y, 2, 0, Math.PI*2); ctx.fillStyle = 'white'; ctx.fill();
                ctx.globalAlpha = 1; 
            });

            // Fireflies (Rare in Celebration)
            if(walkProgress > 0.5) {
                fireflies.forEach((f, index) => {
                    if (gameState === 'CELEBRATING' && index % 8 !== 0) return; 
                    const pulse = (Math.sin(Date.now()/300 + f.offset) + 1) / 2;
                    ctx.fillStyle = `rgba(255, 234, 167, ${pulse * walkProgress})`;
                    ctx.shadowColor = '#ffeaa7'; ctx.shadowBlur = 15;
                    ctx.beginPath(); ctx.arc(f.x, f.y, f.size, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;
                });
            }

            // Ground
            const groundY = height/2 + 50;
            ctx.fillStyle = getGrassColor(walkProgress);
            ctx.beginPath(); ctx.rect(-5000, groundY, 10000, 2000); ctx.fill();

            // Flowers
            flowers.forEach(f => {
                let growth = (walkProgress - f.growThreshold) * 4; 
                growth = Math.max(0, Math.min(1, growth));
                if(growth > 0) drawNaturalFlower(ctx, f.x, groundY + f.yOffset, growth, f.color);
            });

            // Characters - MOBILE RESPONSIVE
            const centerDist = Math.min(width * 0.4, 300); // Scale with screen width
            const dist = centerDist * (1 - walkProgress); 
            let p1x = width/2 - dist - 35; 
            let p2x = width/2 + dist + 35;
            
            let bounceY = 0;
            let stretchX = 1;
            let stretchY = 1;
            
            if (gameState === 'WALKING' && isHolding) {
                const bouncePhase = Math.abs(Math.sin(Date.now()/200)); 
                bounceY = bouncePhase * -5;
                stretchX = 1 + (bouncePhase * 0.05);
                stretchY = 1 - (bouncePhase * 0.05);
            } else if (gameState === 'CELEBRATING') {
                const elapsed = Date.now() - celebrationStartTime;
                const walkPhase = Math.sin(elapsed / 3000); 
                const bouncePhase = Math.abs(Math.sin(Date.now()/200)); 
                
                const wanderRange = (width / 2) - 100;
                const wanderOffset = walkPhase * wanderRange;
                
                p1x += wanderOffset;
                p2x += wanderOffset;
                
                bounceY = bouncePhase * -5;
                stretchX = 1 + (bouncePhase * 0.03);
                stretchY = 1 - (bouncePhase * 0.03);
            }

            ctx.lineWidth = 3; ctx.strokeStyle = '#2d3436';
            
            ctx.save();
            ctx.translate(p1x, groundY - 25 + bounceY);
            ctx.scale(stretchX, stretchY);
            ctx.fillStyle = '#74b9ff';
            ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            drawFace(ctx, 0, 0, true);
            ctx.restore();

            ctx.save();
            ctx.translate(p2x, groundY - 25 + bounceY);
            ctx.scale(stretchX, stretchY);
            ctx.fillStyle = '#fd79a8';
            ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            drawFace(ctx, 0, 0, false);
            ctx.restore();

            if (walkProgress > 0.95) {
                const handY = groundY - 15 + bounceY;
                ctx.beginPath(); 
                ctx.moveTo(p1x + 10, handY); 
                ctx.lineTo((p1x + p2x)/2, handY + 10); 
                ctx.lineTo(p2x - 10, handY); 
                ctx.stroke();
            } else if (walkProgress > 0.1) {
                ctx.beginPath(); ctx.moveTo(p1x + 10, groundY - 15 + bounceY); ctx.lineTo(p1x + 25, groundY - 15 + bounceY - (walkProgress*10)); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(p2x - 10, groundY - 15 + bounceY); ctx.lineTo(p2x - 25, groundY - 15 + bounceY - (walkProgress*10)); ctx.stroke();
            }

            // THE HEART
            if(gameState !== 'WALKING') {
                const pulse = (gameState === 'ASKING' || gameState === 'CELEBRATING') ? Math.sin(Date.now() / 300) * 5 : 0;
                if(gameState === 'ASKING' || gameState === 'CELEBRATING') {
                    ctx.shadowColor = '#ff4757'; ctx.shadowBlur = 20;
                }
                drawHeart(ctx, width/2, heartY, heartSize + pulse);
                ctx.shadowBlur = 0;
            }

            // Confetti
            if(gameState === 'CELEBRATING') {
                confetti.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.rotation += 5;
                    ctx.save(); ctx.translate(width/2 + p.x, heartY + p.y); ctx.rotate(p.rotation*Math.PI/180);
                    ctx.fillStyle = p.color; ctx.fillRect(-4,-4,8,8); ctx.restore();
                });
            }

            ctx.restore();

            // Falling Petals
            if (walkProgress > 0.1) { 
                petals.forEach(p => {
                    ctx.fillStyle = 'rgba(255, 192, 203, 0.7)'; 
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI/180);
                    ctx.beginPath();
                    ctx.moveTo(0,0);
                    ctx.bezierCurveTo(p.size/2, -p.size/2, p.size, -p.size/2, p.size, 0);
                    ctx.bezierCurveTo(p.size, p.size/2, p.size/2, p.size/2, 0, 0);
                    ctx.fill();
                    ctx.restore();
                });
            }

            // Vignette
            const gradient = ctx.createRadialGradient(width/2, height/2, height/3, width/2, height/2, height);
            gradient.addColorStop(0, 'rgba(0,0,0,0)');
            gradient.addColorStop(1, 'rgba(0,0,0,0.3)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0,0,width,height);

            update();
            requestAnimationFrame(render);
        }

        render();

    </script>
</body>
</html>
